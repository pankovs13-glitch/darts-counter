<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151c"><title>Darts Counter</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151c;color:#f5f7fa;font:16px system-ui}button,input,select{font:inherit}button{border:0;border-radius:12px;background:#2b3745;color:white;touch-action:manipulation}.app{max-width:540px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;gap:9px;padding:12px 12px max(12px,env(safe-area-inset-bottom))}.top,.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.top h1{font-size:19px;margin:0}.top button,.foot button{padding:12px}.foot button{flex:1;font-size:13px}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:30vh;overflow:auto}.player{text-align:center;border:2px solid transparent;background:#1b2530;border-radius:12px;padding:7px 4px}.player.active{border-color:#48c79b;background:#17352e}.name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{font-size:clamp(27px,9vw,45px);font-weight:750;font-variant-numeric:tabular-nums}.tag{font-size:11px;color:#a7b6c3}.entry{background:#1b2530;border-radius:12px;text-align:center;padding:7px}.hint{font-size:12px;color:#a7b6c3}.number{font-size:40px;font-weight:700}.status{font-size:12px;color:#ffbe73;min-height:18px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;flex:1;min-height:220px}.keys button{font-size:27px;font-weight:650;min-height:43px}.confirm{background:#27a778;font-size:18px;font-weight:700;padding:14px;min-height:54px}.confirm:disabled{opacity:.4}.overlay{position:fixed;inset:0;z-index:5;background:#10151c;overflow:auto;padding:20px}.panel{max-width:480px;margin:auto}.field{margin:15px 0}.field label{display:block;margin-bottom:6px;color:#a7b6c3}.field input,.field select,.names input{width:100%;padding:12px;border:1px solid #526171;background:#1b2530;color:white;border-radius:10px}.names{display:grid;gap:8px;margin:16px 0}.hidden{display:none!important}@media(max-height:700px){.app{gap:5px;padding-top:5px}.entry .number{font-size:32px}.keys{min-height:180px;gap:5px}.confirm{min-height:45px;padding:8px}.player{padding:4px}}
 .roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.roster-item{display:flex!important;align-items:center;gap:9px;background:#1b2530;padding:11px;border-radius:10px;color:white!important;margin:0!important}.roster-item input{width:22px;height:22px;accent-color:#27a778;flex-shrink:0}.order-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border:1px solid #526171;border-radius:12px;background:#1b2530;touch-action:pan-y}.order-row span{font-weight:600}.order-row div{display:flex;gap:8px}.order-row button{min-width:46px;min-height:42px;font-size:23px}.order-row button:disabled{opacity:.25}.dart-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:8px 0}.dart-chip{position:relative;min-width:0;border:1px solid #465363;background:#14202c;border-radius:10px;padding:8px 24px 8px 6px;text-align:center}.dart-chip.current{border-color:#20c997}.dart-chip small{display:block;font-size:11px;color:#aab9c8}.dart-chip strong{display:block;font-size:23px;margin-top:3px}.dart-remove{position:absolute;right:3px;top:4px;background:#73313a;color:white;border-radius:7px;min-width:25px;min-height:27px;font-size:20px;line-height:1}.entry .number{font-size:32px}</style></head><body><main class="app"><header class="top"><h1>🎯 DARTS</h1><button id="new">Новая игра</button></header><section id="players" class="players"></section><section class="entry"><div id="hint" class="hint"></div><div id="darts" class="dart-list"></div><div id="entry" class="number">0</div><div id="status" class="status"></div></section><section class="keys" id="keys"></section><button class="confirm" id="confirm">Подтвердить ход →</button><footer class="foot"><button id="undo">↶ Отменить</button><button id="historyBtn">История</button></footer></main><section class="overlay hidden" id="setup"><div class="panel"><h2>Новая партия</h2><div class="field"><label>Кто играет? Отметьте участников</label><div id="roster" class="roster"></div></div><div class="field"><label>Начальный счёт</label><select id="startScore"><option>301</option><option>501</option><option>701</option><option value="custom">Другой</option></select></div><div class="field hidden" id="customWrap"><label>Свой счёт</label><input id="customScore" type="number" min="1" max="99999" value="301"></div><div class="hint">Меняйте порядок перетаскиванием или стрелками ↑ ↓</div><div id="names" class="names"></div><button id="start" class="confirm" style="width:100%">Начать игру</button><button id="cancel" style="width:100%;padding:12px;margin-top:10px">Отмена</button></div></section><section class="overlay hidden" id="historyOverlay"><div class="panel"><h2>История ходов</h2><div id="historyList"></div><button id="closeHistory" class="confirm" style="width:100%">Закрыть</button></div></section><script>
const $=id=>document.getElementById(id),key='darts_counter_v1';let state=null,history=[],entry='';let throws=[];try{let s=JSON.parse(localStorage.getItem(key));if(s){state=s.state||s;history=s.history||[];throws=s.throws||[]}}catch(e){}function save(){localStorage.setItem(key,JSON.stringify({state,history,throws}))}function render(){if(!state)return;$('players').replaceChildren(...state.players.map((p,i)=>{let e=document.createElement('div');e.className='player'+(i===state.active?' active':'');for(let [cls,val] of [['name',p.name],['score',p.score],['tag',p.place?'🏆 '+p.place+' место':state.active===i?'● Ваш ход':'Ожидает']]){let d=document.createElement('div');d.className=cls;d.textContent=val;e.append(d)}return e}));let n=throws.reduce((a,b)=>a+b,0)+Number(entry||0),remaining=state.players[state.active].score;$('darts').replaceChildren(...Array.from({length:3},(_,i)=>{let cell=document.createElement('div');cell.className='dart-chip'+(i===throws.length?' current':'');let title=document.createElement('small');title.textContent='Дротик '+(i+1);let value=document.createElement('strong');value.textContent=i<throws.length?String(throws[i]):i===throws.length?(entry||'—'):'—';cell.append(title,value);if(i<throws.length){let remove=document.createElement('button');remove.type='button';remove.className='dart-remove';remove.textContent='×';remove.setAttribute('aria-label','Удалить бросок дротика '+(i+1));remove.onclick=()=>{throws.splice(i,1);entry='';save();render()};cell.append(remove)}else if(i===throws.length&&entry){let remove=document.createElement('button');remove.type='button';remove.className='dart-remove';remove.textContent='×';remove.setAttribute('aria-label','Очистить текущий дротик');remove.onclick=()=>{entry='';render()};cell.append(remove)}return cell}));$('entry').textContent=entry||'0';$('hint').textContent=state.players[state.active].name+' · бросок '+Math.min(throws.length+1,3)+' из 3';$('status').textContent=n>remaining?'BUST — счёт не изменится':n===remaining?'Выход на 0!':'Сумма: '+n+' · останется: '+(remaining-n);$('confirm').disabled=state.winner!==null||(!entry&&throws.length===0);$('confirm').textContent=state.winner!==null?'Партия завершена':n>remaining?'BUST → следующий':n===remaining?'🏆 Зафиксировать место':throws.length===2?'Завершить ход →':'Записать дротик →';$('undo').disabled=!history.length}function add(k){if(!state||state.winner!==null||throws.length>=3)return;if(k==='C')entry='';else if(k==='⌫')entry=entry.slice(0,-1);else if(entry.length<2)entry=(entry+k).replace(/^0+(?=\d)/,'');render()}for(let k of ['1','2','3','4','5','6','7','8','9','C','0','⌫']){let b=document.createElement('button');b.textContent=k;b.onclick=()=>add(k);$('keys').append(b)}$('confirm').onclick=()=>{if(!state||state.winner!==null||(!entry&&throws.length===0))return;let value=Number(entry||0);if(value>60){alert('За один дротик максимум 60 очков');return}if(entry) throws.push(value);else if(throws.length) throws.push(0);let n=throws.reduce((a,b)=>a+b,0),p=state.players[state.active];if(throws.length<3&&n<p.score){entry='';save();render();return}let old=JSON.parse(JSON.stringify(state));history.push({state:old,player:p.name,points:n,bust:n>p.score,throws:[...throws]});if(n<=p.score){p.score-=n;if(p.score===0){state.places=state.places||[];state.places.push(state.active);p.place=state.places.length}}let eligible=state.players.map((x,i)=>({x,i})).filter(o=>!o.x.place);if((state.places||[]).length>=Math.min(3,state.players.length)||eligible.length===0){state.winner=(state.places||[])[0]??null}else if(eligible.length){let next=(state.active+1)%state.players.length;while(state.players[next].place)next=(next+1)%state.players.length;state.active=next}throws=[];entry='';save();render()};$('undo').onclick=()=>{let h=history.pop();if(h){state=h.state;throws=[];entry='';save();render()}};const pool=['Стас','Сергей','Евгений','Татьяна','Андрей','Артем','Ярослав'];let lineup=[...pool];let selectedPlayers=new Set(pool.slice(0,3));function roster(){let root=$('roster');root.replaceChildren(...pool.map(name=>{let label=document.createElement('label');label.className='roster-item';let input=document.createElement('input');input.type='checkbox';input.checked=selectedPlayers.has(name);input.onchange=()=>{if(input.checked)selectedPlayers.add(name);else selectedPlayers.delete(name);names()};let span=document.createElement('span');span.textContent=name;label.append(input,span);return label}))}function names(){let chosen=lineup.filter(name=>selectedPlayers.has(name));let n=chosen.length;$('names').replaceChildren(...chosen.map((name,i)=>{let row=document.createElement('div');row.className='order-row';row.draggable=true;row.dataset.name=name;let label=document.createElement('span');label.textContent=(i+1)+'. '+name;let controls=document.createElement('div');let up=document.createElement('button'),down=document.createElement('button');up.textContent='↑';down.textContent='↓';up.type=down.type='button';up.disabled=i===0;down.disabled=i===n-1;up.onclick=()=>move(i,i-1);down.onclick=()=>move(i,i+1);controls.append(up,down);row.append(label,controls);row.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move'});row.addEventListener('dragover',e=>e.preventDefault());row.addEventListener('drop',e=>{e.preventDefault();let from=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(from)&&from>=0&&from<n)move(from,i)});let touchY=0;row.addEventListener('touchstart',e=>{if(e.target.tagName==='BUTTON')return;touchY=e.touches[0].clientY},{passive:true});row.addEventListener('touchend',e=>{if(e.target.tagName==='BUTTON')return;let diff=e.changedTouches[0].clientY-touchY;if(Math.abs(diff)>35)move(i,Math.max(0,Math.min(n-1,i+Math.round(diff/56)||i+(diff>0?1:-1))))},{passive:true});return row}))}function move(from,to){let chosen=lineup.filter(name=>selectedPlayers.has(name));if(from===to||to<0||to>=chosen.length)return;let [item]=chosen.splice(from,1);chosen.splice(to,0,item);let it=chosen[Symbol.iterator]();lineup=lineup.map(name=>selectedPlayers.has(name)?it.next().value:name);names()}$('startScore').onchange=()=>$('customWrap').classList.toggle('hidden',$('startScore').value!=='custom');$('new').onclick=()=>{roster();names();$('setup').classList.remove('hidden')};$('cancel').onclick=()=>$('setup').classList.add('hidden');$('start').onclick=()=>{let score=$('startScore').value==='custom'?Number($('customScore').value):Number($('startScore').value);if(!Number.isInteger(score)||score<1||score>99999){alert('Введите счёт от 1 до 99999');return}let selected=lineup.filter(name=>selectedPlayers.has(name));if(!selected.length){alert('Выберите хотя бы одного игрока');return}if(selected.some(x=>!x)||new Set(selected).size!==selected.length){alert('Выберите разных игроков для всех ходов');return}state={players:selected.map(name=>({name,score})),active:0,winner:null,places:[]};history=[];throws=[];entry='';save();$('setup').classList.add('hidden');render()};$('historyBtn').onclick=()=>{$('historyList').replaceChildren(...history.map((h,i)=>{let p=document.createElement('p');p.textContent=(i+1)+'. '+h.player+': '+h.points+' ('+(h.throws||[]).join(' + ')+')'+(h.bust?' BUST':'');return p}).reverse());if(!history.length)$('historyList').textContent='Ходов пока нет';$('historyOverlay').classList.remove('hidden')};$('closeHistory').onclick=()=>$('historyOverlay').classList.add('hidden');if(state&&Array.isArray(state.players)&&state.players.length){state.places=state.places||[];render();}else{state=null;roster();names();$('setup').classList.remove('hidden')}
</script></body></html>
